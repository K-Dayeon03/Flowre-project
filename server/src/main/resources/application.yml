spring:
  application:
    name: server

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/flowre?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    driver-class-name: ${DB_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        # 대량 재고 적재 시 UPDATE/DELETE 문을 묶어 DB round-trip을 줄인다.
        # (PK가 IDENTITY/AUTO_INCREMENT라 INSERT 배치는 Hibernate가 비활성화한다 —
        #  진정한 대량 INSERT가 필요해지면 JDBC batch 또는 INSERT ... ON DUPLICATE KEY UPDATE 전환 검토)
        jdbc:
          batch_size: 500
        order_inserts: true
        order_updates: true

  data:
    redis:
      host: localhost
      port: 6379

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:flowre-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm}
  access-expiration: 1800000    # 30분 (ms)
  refresh-expiration: 604800000 # 7일 (ms)

aws:
  s3:
    access-key: ${AWS_ACCESS_KEY_ID:your-access-key}
    secret-key: ${AWS_SECRET_ACCESS_KEY:your-secret-key}
    region: ${AWS_REGION:ap-northeast-2}
    bucket: ${AWS_S3_BUCKET:flowre-bucket}
  presigned-url-expiration: 600 # 10분 (초)

cors:
  allowed-origins: "http://localhost:8081,http://localhost:19006,http://localhost:3000"

flowre:
  kakao:
    rest-api-key: ${KAKAO_REST_API_KEY:}
  inventory:
    data-dir: ../data
    auto-load: true
  employee:
    # 직원 코드 자동 로테이션 주기 (일). ADMIN 계정은 대상 제외.
    code-rotation-days: ${FLOWRE_CODE_ROTATION_DAYS:90}
  # 부트스트랩 관리자 계정 — 본사 최초 로그인용 단일 ADMIN 계정.
  # 직원 계정은 본사가 앱에서 직접 발급한다. 운영 환경에서는 아래 값을 환경변수로 반드시 덮어쓸 것.
  admin:
    enabled: ${FLOWRE_ADMIN_ENABLED:true}
    brand-id: ${FLOWRE_ADMIN_BRAND_ID:1}
    store-code: ${FLOWRE_ADMIN_STORE_CODE:0000}
    store-name: ${FLOWRE_ADMIN_STORE_NAME:Flowre 운영 본부}
    employee-code: ${FLOWRE_ADMIN_EMPLOYEE_CODE:0000ADMN!}
    email: ${FLOWRE_ADMIN_EMAIL:admin@flowre.local}
    name: ${FLOWRE_ADMIN_NAME:시스템 관리자}
    password: ${FLOWRE_ADMIN_PASSWORD:flowre-admin-1234!}

logging:
  level:
    com.flowre: DEBUG
    org.springframework.security: DEBUG
