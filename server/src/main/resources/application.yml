spring:
  application:
    name: server

  datasource:
    url: jdbc:mysql://localhost:3306/flowre?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        # 대량 재고 적재 시 UPDATE/DELETE 문을 묶어 DB round-trip을 줄인다.
        # (PK가 IDENTITY/AUTO_INCREMENT라 INSERT 배치는 Hibernate가 비활성화한다 —
        #  진정한 대량 INSERT가 필요해지면 JDBC batch 또는 INSERT ... ON DUPLICATE KEY UPDATE 전환 검토)
        jdbc:
          batch_size: 500
        order_inserts: true
        order_updates: true

  data:
    redis:
      host: localhost
      port: 6379

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: 8080

jwt:
  secret: flowre-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm
  access-expiration: 1800000    # 30분 (ms)
  refresh-expiration: 604800000 # 7일 (ms)

aws:
  s3:
    access-key: your-access-key
    secret-key: your-secret-key
    region: ap-northeast-2
    bucket: flowre-bucket
  presigned-url-expiration: 600 # 10분 (초)

cors:
  allowed-origins: "http://localhost:8081,http://localhost:19006,http://localhost:3000"

flowre:
  inventory:
    data-dir: ../data
    auto-load: true

logging:
  level:
    com.flowre: DEBUG
    org.springframework.security: DEBUG
