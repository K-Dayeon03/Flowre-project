spring:
  datasource:
    url: jdbc:h2:file:./data/flowre-local;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console

flowre:
  simulation:
    reset-on-start: false

# 로컬 실행 중에만 사용할 임시 서명 키
jwt:
  secret: ${JWT_SECRET:${random.uuid}${random.uuid}}
